@keyframes bezel{0%,8%{fill:#fffaf6}28%{fill:#5a2c45}48%,80%{fill:#20121b}90%,100%{fill:#fffaf6}}
.scr{animation:scr 12s linear infinite}
@keyframes scr{0%,8%{fill:#fff3ee}28%{fill:#3a1b2c}48%,80%{fill:#140a12}90%,100%{fill:#fff3ee}}
