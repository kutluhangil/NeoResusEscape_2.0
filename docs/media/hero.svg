.ok{animation:ok 12s cubic-bezier(.3,1.3,.5,1) infinite}
@keyframes ok{0%{opacity:0;transform:none}41.7%{opacity:0;transform:none}44.6%{opacity:1;transform:none}78.3%{opacity:1;transform:none}81.3%{opacity:0;transform:none}100%{opacity:0;transform:none}}
.qz{animation:qz 12s cubic-bezier(.3,1.3,.5,1) infinite;transform-box:fill-box;transform-origin:center}
@keyframes qz{0%{opacity:0;transform:scale(.85)}25%{opacity:0;transform:scale(.85)}27.9%{opacity:1;transform:none}80%{opacity:1;transform:none}82.9%{opacity:0;transform:scale(.85)}100%{opacity:0;transform:scale(.85)}}
@keyframes t0{0%{opacity:0}0%{opacity:0}0.4%{opacity:1}33.3%{opacity:1}33.8%{opacity:0}100%{opacity:0}}
@keyframes t1{0%{opacity:0}33.3%{opacity:0}33.8%{opacity:1}66.7%{opacity:1}67.1%{opacity:0}100%{opacity:0}}
@keyframes t2{0%{opacity:0}66.7%{opacity:0}67.1%{opacity:1}100%{opacity:1}100.4%{opacity:0}100%{opacity:0}}
@keyframes sv0{0%{opacity:0}0%{opacity:0}1.7%{opacity:1}45%{opacity:1}46.7%{opacity:0}100%{opacity:0}}
@keyframes sv1{0%{opacity:0}45%{opacity:0}46.7%{opacity:1}98.3%{opacity:1}100%{opacity:0}100%{opacity:0}}
.dg{animation:dg 12s cubic-bezier(.3,1.3,.5,1) infinite;transform-box:fill-box;transform-origin:center}
@keyframes dg{0%{opacity:0;transform:scale(.85)}46.7%{opacity:0;transform:scale(.85)}49.6%{opacity:1;transform:none}95%{opacity:1;transform:none}97.9%{opacity:0;transform:scale(.85)}100%{opacity:0;transform:scale(.85)}}
.dig{animation:dig 12s cubic-bezier(.3,1.3,.5,1) infinite}
@keyframes dig{0%{opacity:0;transform:translateY(-14px)}48.3%{opacity:0;transform:translateY(-14px)}51.2%{opacity:1;transform:none}70%{opacity:1;transform:none}72.9%{opacity:0;transform:translateY(-14px)}100%{opacity:0;transform:translateY(-14px)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
