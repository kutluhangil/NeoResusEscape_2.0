.led{animation:led 3.2s steps(1) infinite}@keyframes led{0%,100%{opacity:.9}47%{opacity:.25}49%{opacity:.9}73%{opacity:.5}75%{opacity:.9}}
.xh{animation:xh 12s cubic-bezier(.5,0,.2,1) infinite}
