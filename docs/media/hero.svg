<text x="766" y="156" font-family="'Iowan Old Style','Palatino Linotype',Palatino,Georgia,serif" font-style="italic" font-size="11" fill="#fff">Two minutes after birth, preductal SpO₂</text><text x="766" y="171" font-family="'Iowan Old Style','Palatino Linotype',Palatino,Georgia,serif" font-style="italic" font-size="11" fill="#fff">reads 68%. What do you do?</text><rect x="766" y="184" width="244" height="20" rx="6" fill="#fff" fill-opacity=".06"/><text x="776" y="198" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="8" font-weight="700" fill="#ffd166">A</text><text x="792" y="198" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="8" fill="#fff" fill-opacity=".85">Aim for 100% straight away</text><rect x="766" y="208" width="244" height="20" rx="6" fill="#fff" fill-opacity=".06"/><text x="776" y="222" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="8" font-weight="700" fill="#ffd166">B</text><text x="792" y="222" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="8" fill="#fff" fill-opacity=".85">Follow the minute target table</text><rect x="766" y="232" width="244" height="20" rx="6" fill="#fff" fill-opacity=".06"/><text x="776" y="246" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="8" font-weight="700" fill="#ffd166">C</text><text x="792" y="246" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="8" fill="#fff" fill-opacity=".85">Stop oxygen, recheck at 10 min</text><rect x="766" y="256" width="244" height="20" rx="6" fill="#fff" fill-opacity=".06"/><text x="776" y="270" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="8" font-weight="700" fill="#ffd166">D</text><text x="792" y="270" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="8" fill="#fff" fill-opacity=".85">Ignore it while ventilating</text><g class="ok"><rect x="766" y="208" width="244" height="20" rx="6" fill="#30d158" fill-opacity=".28" stroke="#30d158"/><text x="1002" y="222" text-anchor="end" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="7" font-weight="700" fill="#30d158">✓ DIGIT 7</text></g></g></g><rect x="650" y="58" width="108" height="22" rx="11" fill="#000" fill-opacity=".55"/><g style="animation:t0 12s linear infinite"><text x="662" y="73" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="8.5" fill="#fff">⏱ 04:12</text></g><g style="animation:t1 12s linear infinite"><text x="662" y="73" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="8.5" fill="#fff">⏱ 04:16</text></g><g style="animation:t2 12s linear infinite"><text x="662" y="73" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="8.5" fill="#fff">⏱ 04:20</text></g><g style="animation:sv0 12s linear infinite"><text x="748" y="73" text-anchor="end" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="8.5" fill="#ff4d5e">3/10</text></g><g style="animation:sv1 12s linear infinite"><text x="748" y="73" text-anchor="end" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="8.5" fill="#ff4d5e">4/10</text></g><rect x="964" y="306" width="162" height="28" rx="10" fill="#000" fill-opacity=".6"/><text x="974" y="324" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="6.5" fill="#fff" fill-opacity=".6">DOOR</text><text x="1004" y="325" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="10" font-weight="700" fill="#3ad1c4">4</text><text x="1016" y="325" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="10" font-weight="700" fill="#3ad1c4">1</text><text x="1028" y="325" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="10" font-weight="700" fill="#